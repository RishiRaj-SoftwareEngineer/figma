<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trip Australia - E-Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --green: #4CAF50;
    --green-deep: #2E7D32;
    --navy: #1A237E;
    --cream: #FFF9C4;
    --cream-ink: #8D6E00;
    --pink: #F8D7DA;
    --red: #D32F2F;
    --gray-bar: #B0BEC5;
    --gray-card: #F4F5F7;
    --gray: #E0E0E0;
    --muted: #8B93A7;
    --line: #E4E7ED;
    --white: #FFFFFF;
    --card-shadow: 0 14px 30px rgba(20,45,25,.16);
  }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    padding: 28px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F3F6F2;
    font-family: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    position: relative;
    width: 393px;
    height: 852px;
    padding: 14px 18px 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 40px;
    background: linear-gradient(178deg, #6FC474 0%, #8BCA80 30%, #B6D783 62%, #DCE9A0 88%, #E9EEB2 100%);
    box-shadow: 0 34px 70px -26px rgba(28,60,32,.45), 0 0 0 1px rgba(20,45,25,.10);
  }

  .screen::before {
    content: "";
    position: absolute;
    top: -140px; right: -120px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 68%);
    pointer-events: none;
  }

  /* header */
  .app-bar {
    position: relative;
    z-index: 2;
    flex: none;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-family: "Pacifico", "Brush Script MT", cursive;
    font-size: 19.5px;
    line-height: 1.3;
    color: var(--navy);
    padding-bottom: 2px;
  }

  .page-title {
    position: relative;
    z-index: 2;
    flex: none;
    margin: 2px 0 0;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -.6px;
    text-align: center;
    color: var(--navy);
  }

  /* ticket card */
  .ticket {
    position: relative;
    z-index: 2;
    flex: none;
    align-self: center;
    width: 353px;
    height: 620px;
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 24px;
    background: var(--white);
    box-shadow: var(--card-shadow);
    --cut: 11px;
    --cut-y: 310px;
    -webkit-mask-image:
      radial-gradient(circle var(--cut) at 0 var(--cut-y), transparent 98%, #000 100%),
      radial-gradient(circle var(--cut) at 100% var(--cut-y), transparent 98%, #000 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      radial-gradient(circle var(--cut) at 0 var(--cut-y), transparent 98%, #000 100%),
      radial-gradient(circle var(--cut) at 100% var(--cut-y), transparent 98%, #000 100%);
    mask-composite: intersect;
  }

  .top-bar {
    flex: none;
    height: 10px;
    background: var(--gray-bar);
  }

  .ticket-body {
    flex: 1;
    min-height: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }

  /* pink flight summary */
  .flight-bar {
    flex: none;
    height: 92px;
    padding: 13px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-radius: 14px;
    background: var(--pink);
  }

  .fb-row { display: flex; align-items: center; gap: 10px; }
  .fb-point { display: flex; flex-direction: column; gap: 2px; }
  .fb-point.right { align-items: flex-end; text-align: right; }

  .fb-time {
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -.2px;
    color: var(--red);
  }

  .fb-code { font-size: 9.5px; font-weight: 600; letter-spacing: .12em; color: rgba(211,47,47,.72); }

  .fb-mid { flex: 1; display: flex; align-items: center; gap: 5px; }
  .fb-mid .dash { flex: 1; height: 1.5px; border-radius: 2px; background: repeating-linear-gradient(90deg, rgba(211,47,47,.55) 0 4px, transparent 4px 8px); }
  .fb-mid svg { flex: none; width: 14px; height: 14px; color: rgba(211,47,47,.75); transform: rotate(90deg); }

  .fb-meta { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 500; color: #A9505A; }
  .fb-meta .sep { width: 3px; height: 3px; border-radius: 50%; background: rgba(169,80,90,.6); }

  /* flight details */
  .details-panel {
    flex: none;
    height: 56px;
    margin-top: 14px;
    padding: 0 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: center;
    border-radius: 14px;
    background: var(--gray-card);
  }

  .cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cell + .cell { padding-left: 10px; border-left: 1px solid rgba(176,190,197,.45); }

  .cell-value {
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -.2px;
    color: var(--navy);
    white-space: nowrap;
  }

  .cell-label {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* passenger details */
  .passenger-row {
    flex: none;
    height: 50px;
    margin-top: 12px;
    display: grid;
    grid-template-columns: 1.35fr 1.15fr .8fr;
    align-items: center;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .p-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding-right: 8px; }
  .p-value { font-size: 12.5px; font-weight: 600; line-height: 1.15; color: var(--navy); white-space: nowrap; }
  .p-value.seat { font-weight: 700; color: var(--green-deep); }
  .p-label { font-size: 8px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* cream notice */
  .ticket-note {
    flex: none;
    height: 36px;
    margin-top: 12px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 12px;
    background: var(--cream);
  }

  .ticket-note svg { flex: none; width: 13px; height: 13px; color: var(--cream-ink); }
  .ticket-note span { font-size: 10px; font-weight: 500; color: var(--cream-ink); }

  /* perforation */
  .perforation {
    position: relative;
    flex: none;
    height: 24px;
    margin-bottom: 12px;
  }

  .perforation::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 2px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, #D8DFE8 0 6px, transparent 6px 12px);
  }

  /* QR */
  .qr-block {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
  }

  .qr { flex: none; width: 180px; height: 180px; }
  .qr svg { display: block; width: 100%; height: 100%; }

  .qr-caption { margin: 0; font-size: 10px; font-weight: 500; color: var(--muted); }
  .qr-ref { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--navy); }

  /* bottom actions */
  .actions {
    position: relative;
    z-index: 2;
    flex: none;
    align-self: center;
    width: 353px;
    margin-top: 14px;
    display: flex;
    gap: 13px;
  }

  .action-btn {
    flex: 1;
    height: 56px;
    border: 0;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--white);
    cursor: pointer;
    background: var(--green);
    box-shadow: 0 10px 22px rgba(76,175,80,.34);
    transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
  }

  .action-btn svg { width: 17px; height: 17px; }
  .action-btn:hover { background: #43A047; transform: translateY(-1px); box-shadow: 0 13px 26px rgba(76,175,80,.42); }
  .action-btn:active { transform: scale(.98); box-shadow: 0 6px 14px rgba(76,175,80,.30); }
  .action-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 0 0 6px rgba(76,175,80,.6); }

  @media (prefers-reduced-motion: reduce) {
    .action-btn { transition: none; }
  }
</style>
</head>
<body>
  <main class="screen" aria-label="Trip Australia e-ticket screen">

    <header class="app-bar">
      <div class="brand">Trip Australia</div>
    </header>

    <h1 class="page-title">E-Ticket</h1>

    <section class="ticket" aria-label="Boarding pass">
      <span class="top-bar" aria-hidden="true"></span>

      <div class="ticket-body">

        <div class="flight-bar">
          <div class="fb-row">
            <div class="fb-point">
              <span class="fb-time">06:00 AM</span>
              <span class="fb-code">SYD</span>
            </div>
            <div class="fb-mid">
              <span class="dash"></span>
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M21 15.5 13.5 12V5.2a1.6 1.6 0 0 0-3.2 0V12L3 15.5V17l7.3-2.1v3.6l-2.2 1.6v1.3l3.8-1.1 3.8 1.1v-1.3L13.5 18.5v-3.6L21 17z"/>
              </svg>
              <span class="dash"></span>
            </div>
            <div class="fb-point right">
              <span class="fb-time">07:35 AM</span>
              <span class="fb-code">MEL</span>
            </div>
          </div>
          <div class="fb-meta">1 hr 35 min<span class="sep"></span>Virgin Australia</div>
        </div>

        <div class="details-panel">
          <div class="cell">
            <span class="cell-value">Economy</span>
            <span class="cell-label">Class</span>
          </div>
          <div class="cell">
            <span class="cell-value">4</span>
            <span class="cell-label">Gate</span>
          </div>
          <div class="cell">
            <span class="cell-value">3</span>
            <span class="cell-label">Terminal</span>
          </div>
          <div class="cell">
            <span class="cell-value">VH-IJQ</span>
            <span class="cell-label">Flight</span>
          </div>
        </div>

        <div class="passenger-row">
          <div class="p-cell">
            <span class="p-value">Morgan, Alice</span>
            <span class="p-label">Passenger</span>
          </div>
          <div class="p-cell">
            <span class="p-value">22 years, Male</span>
            <span class="p-label">Age</span>
          </div>
          <div class="p-cell">
            <span class="p-value seat">17 D</span>
            <span class="p-label">Seat</span>
          </div>
        </div>

        <div class="ticket-note">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 7.6v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="16.4" r="1.1" fill="currentColor"/>
          </svg>
          <span>Arrive at the gate 30 min before departure.</span>
        </div>

        <div class="perforation" aria-hidden="true"></div>

        <div class="qr-block">
          <div class="qr" id="qr" role="img" aria-label="Boarding QR code"></div>
          <p class="qr-caption">Scan at the boarding gate</p>
          <p class="qr-ref">Booking Ref TA-84721</p>
        </div>

      </div>
    </section>

    <div class="actions">
      <button class="action-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 9V4.6h10V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3.5" y="9" width="17" height="7" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <rect x="6.5" y="14" width="11" height="6" rx="1.6" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        PRINT
      </button>
      <button class="action-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3.5" y="5.5" width="17" height="13" rx="2.4" stroke="currentColor" stroke-width="1.8"/>
          <path d="m4.5 7 7.5 6 7.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        E-MAIL
      </button>
    </div>
  </main>

<script>
  (function () {
    const SIZE = 25;
    const QUIET = 2;
    const grid = [];

    for (let y = 0; y < SIZE; y++) {
      grid.push(new Array(SIZE).fill(0));
    }

    function finder(ox, oy) {
      for (let y = -1; y <= 7; y++) {
        for (let x = -1; x <= 7; x++) {
          const gx = ox + x;
          const gy = oy + y;
          if (gx < 0 || gy < 0 || gx >= SIZE || gy >= SIZE) continue;
          if (x < 0 || y < 0 || x > 6 || y > 6) { grid[gy][gx] = 0; continue; }
          const edge = x === 0 || x === 6 || y === 0 || y === 6;
          const core = x >= 2 && x <= 4 && y >= 2 && y <= 4;
          grid[gy][gx] = (edge || core) ? 1 : 0;
        }
      }
    }

    finder(0, 0);
    finder(SIZE - 7, 0);
    finder(0, SIZE - 7);

    for (let i = 8; i < SIZE - 8; i++) {
      grid[6][i] = i % 2 === 0 ? 1 : 0;
      grid[i][6] = i % 2 === 0 ? 1 : 0;
    }

    const ax = 18;
    const ay = 18;

    for (let y = -2; y <= 2; y++) {
      for (let x = -2; x <= 2; x++) {
        grid[ay + y][ax + x] = Math.max(Math.abs(x), Math.abs(y)) === 1 ? 0 : 1;
      }
    }

    function reserved(x, y) {
      if (x < 8 && y < 8) return true;
      if (x >= SIZE - 8 && y < 8) return true;
      if (x < 8 && y >= SIZE - 8) return true;
      if (x === 6 || y === 6) return true;
      if (Math.abs(x - ax) <= 2 && Math.abs(y - ay) <= 2) return true;
      return false;
    }

    let seed = 20260925;

    function rnd() {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      return seed / 2147483648;
    }

    let path = "";
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        if (!reserved(x, y)) grid[y][x] = rnd() > 0.5 ? 1 : 0;
        if (grid[y][x]) path += "M" + (x + QUIET) + " " + (y + QUIET) + "h1v1h-1z";
      }
    }

    const dim = SIZE + QUIET * 2;
    document.getElementById("qr").innerHTML =
      '<svg viewBox="0 0 ' + dim + ' ' + dim + '" shape-rendering="crispEdges" aria-hidden="true">' +
      '<rect width="' + dim + '" height="' + dim + '" fill="#FFFFFF"/>' +
      '<path d="' + path + '" fill="#1A237E"/>' +
      "</svg>";
  })();
</script>
</body>
</html>
