<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trip Australia - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --green: #4CAF50;
    --green-deep: #2E7D32;
    --navy: #1A237E;
    --cream: #FFF9C4;
    --gray-text: #9E9E9E;
    --white: #FFFFFF;
  }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    padding: 28px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F3F6F2;
    font-family: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    position: relative;
    width: 393px;
    height: 852px;
    padding: 16px 26px 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 40px;
    background: linear-gradient(180deg, #4CAF50 0%, #7CC46B 34%, #C6D98A 66%, #FFF9C4 100%);
    box-shadow: 0 34px 70px -26px rgba(28,60,32,.45), 0 0 0 1px rgba(20,45,25,.10);
  }

  .screen::before {
    content: "";
    position: absolute;
    top: -150px; right: -130px;
    width: 330px; height: 330px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.26) 0%, rgba(255,255,255,0) 68%);
    pointer-events: none;
  }

  .screen::after {
    content: "";
    position: absolute;
    left: -140px; bottom: -160px;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.4) 0%, rgba(255,255,255,0) 70%);
    pointer-events: none;
  }

  /* header */
  .app-bar {
    position: relative;
    z-index: 2;
    flex: none;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-family: "Pacifico", "Brush Script MT", cursive;
    font-size: 19.5px;
    line-height: 1.3;
    color: var(--navy);
    padding-bottom: 2px;
  }

  .back-btn {
    flex: none;
    width: 40px; height: 40px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 2px solid rgba(255,255,255,.92);
    border-radius: 50%;
    background: var(--green);
    color: var(--white);
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(30,90,40,.28);
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .back-btn svg { width: 18px; height: 18px; }
  .back-btn:hover { transform: translateY(-1px); box-shadow: 0 9px 18px rgba(30,90,40,.34); }
  .back-btn:active { transform: scale(.93); }
  .back-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,.7), 0 6px 14px rgba(30,90,40,.28); }

  /* heading */
  .page-title {
    position: relative;
    z-index: 2;
    flex: none;
    margin: 12px 0 0;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -.8px;
    text-align: center;
    color: var(--navy);
  }

  .page-sub {
    position: relative;
    z-index: 2;
    flex: none;
    margin: 8px 0 0;
    font-size: 11.5px;
    font-weight: 400;
    line-height: 1.5;
    text-align: center;
    color: rgba(26,35,126,.72);
  }

  /* fields */
  .form { position: relative; z-index: 2; flex: none; margin-top: 28px; }

  .field { position: relative; display: block; }
  .field + .field { margin-top: 14px; }

  .field-icon {
    position: absolute;
    left: 17px; top: 50%;
    transform: translateY(-50%);
    display: grid;
    place-items: center;
    color: var(--gray-text);
    pointer-events: none;
    transition: color .18s ease;
  }

  .field-icon svg { width: 18px; height: 18px; }

  .field-input {
    width: 100%;
    height: 58px;
    padding: 0 50px;
    border: 1.5px solid rgba(255,255,255,.85);
    border-radius: 16px;
    background: var(--white);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--navy);
    outline: none;
    box-shadow: 0 8px 18px rgba(20,60,25,.12);
    transition: border-color .18s ease, box-shadow .18s ease;
  }

  .field-input::placeholder { color: var(--gray-text); font-weight: 400; }
  .field-input:focus { border-color: var(--green-deep); box-shadow: 0 0 0 3px rgba(46,125,50,.22), 0 8px 18px rgba(20,60,25,.12); }
  .field:focus-within .field-icon { color: var(--green-deep); }

  .field-eye {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    width: 38px; height: 38px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 11px;
    background: none;
    color: var(--gray-text);
    cursor: pointer;
    transition: color .18s ease, background-color .18s ease;
  }

  .field-eye svg { width: 18px; height: 18px; }
  .field-eye:hover { color: var(--navy); background: #F2F5F8; }
  .field-eye:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(46,125,50,.3); }

  /* login button + forgot */
  .actions {
    position: relative;
    z-index: 2;
    flex: none;
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .login-btn {
    width: 340px;
    height: 56px;
    border: 0;
    border-radius: 28px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: .3px;
    color: var(--white);
    cursor: pointer;
    background: var(--green);
    box-shadow: 0 12px 24px rgba(40,110,45,.34);
    transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
  }

  .login-btn:hover { background: #43A047; transform: translateY(-1px); box-shadow: 0 15px 28px rgba(40,110,45,.42); }
  .login-btn:active { transform: scale(.98); box-shadow: 0 7px 16px rgba(40,110,45,.3); }
  .login-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 0 0 6px rgba(76,175,80,.6); }
  .login-btn.is-busy { opacity: .78; cursor: default; transform: none; }

  .forgot {
    margin-top: 12px;
    align-self: flex-end;
    margin-right: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--navy);
    text-decoration: none;
  }

  .forgot:hover { text-decoration: underline; }
  .forgot:focus-visible { outline: none; border-radius: 6px; box-shadow: 0 0 0 3px rgba(76,175,80,.3); }

  /* divider */
  .divider {
    position: relative;
    z-index: 2;
    flex: none;
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(26,35,126,.22); }
  .divider span { font-size: 11px; font-weight: 500; color: rgba(26,35,126,.6); white-space: nowrap; }

  /* socials */
  .socials {
    position: relative;
    z-index: 2;
    flex: none;
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
  }

  .social {
    width: 56px; height: 56px;
    display: grid;
    place-items: center;
    border: 1.5px solid rgba(255,255,255,.9);
    border-radius: 50%;
    background: var(--white);
    color: var(--navy);
    cursor: pointer;
    box-shadow: 0 8px 16px rgba(20,60,25,.12);
    transition: transform .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
  }

  .social svg { width: 20px; height: 20px; }
  .social:hover { transform: translateY(-2px); border-color: rgba(76,175,80,.6); color: var(--green); box-shadow: 0 10px 20px rgba(76,175,80,.22); }
  .social:active { transform: scale(.96); }
  .social:focus-visible { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(76,175,80,.3); }

  /* footer */
  .footer {
    position: relative;
    z-index: 2;
    flex: none;
    margin-top: auto;
    margin-bottom: 14px;
    font-size: 11.5px;
    font-weight: 400;
    text-align: center;
    color: rgba(26,35,126,.75);
  }

  .footer a { font-weight: 700; color: var(--green-deep); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .footer a:focus-visible { outline: none; border-radius: 6px; box-shadow: 0 0 0 3px rgba(76,175,80,.3); }

  .home-indicator {
    flex: none;
    margin-bottom: 9px;
    align-self: center;
    width: 126px; height: 5px;
    border-radius: 99px;
    background: rgba(26,35,126,.28);
  }

  @media (prefers-reduced-motion: reduce) {
    .login-btn, .social, .back-btn, .field-input, .field-eye { transition: none; }
  }
</style>

<body>
  <main class="screen" aria-label="Trip Australia login screen">

    <header class="app-bar">
      <div class="brand">Trip Australia</div>
      <button class="back-btn" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <h1 class="page-title">Welcome Back!</h1>
    <p class="page-sub">Sign in to manage your bookings and fly with Trip Australia.</p>

    <form class="form" id="loginForm" novalidate>

      <label class="field" for="username">
        <span class="field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8.4" r="3.7" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5.4 19.6a6.6 6.6 0 0 1 13.2 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <input class="field-input" id="username" name="username" type="text" autocomplete="username" placeholder="Username or Email" />
      </label>

      <label class="field" for="password">
        <span class="field-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="4.8" y="10.4" width="14.4" height="9.4" rx="2.4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8.4 10.4V7.9a3.6 3.6 0 0 1 7.2 0v2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="15.1" r="1.3" fill="currentColor"/>
          </svg>
        </span>
        <input class="field-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" />
        <button class="field-eye" id="eyePwd" type="button" aria-label="Show password" aria-pressed="false"></button>
      </label>

    </form>

    <div class="actions">
      <button class="login-btn" id="loginBtn" type="submit" form="loginForm">Login</button>
      <a class="forgot" href="#">Forgot Password?</a>
    </div>

    <div class="divider" role="separator"><span>Or Login with</span></div>

    <div class="socials">
      <button class="social" type="button" aria-label="Login with Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M14.6 8.6h2.2V5.6h-2.5c-2.3 0-3.8 1.5-3.8 3.8v1.7H8.3v3h2.2V21h3.2v-6.9h2.4l.5-3h-2.9V9.6c0-.7.3-1 1-1z"/>
        </svg>
      </button>
      <button class="social" type="button" aria-label="Login with Apple">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16.3 12.7c0-2 1.6-3 1.7-3.1-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.5 2 2.6 2 1 0 1.4-.6 2.6-.6 1.2 0 1.6.6 2.6.6 1.1 0 1.8-1 2.4-2 .8-1.1 1.1-2.2 1.1-2.3 0 0-2.2-.9-2.2-3zM14.5 6.5c.5-.6.9-1.5.8-2.4-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.3.9.1 1.8-.4 2.3-1.1z"/>
        </svg>
      </button>
      <button class="social" type="button" aria-label="Login with Google">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 6c1.6 0 2.9.6 3.8 1.5l1.7-1.6C16.2 4.6 14.5 4 12 4 8.7 4 6 6.7 6 10s2.7 6 6 6c3.5 0 5.8-2.4 5.8-5.9 0-.4 0-.7-.1-1.1H12v2.4h3.4c-.3 1.3-1.6 3-3.4 3-2 0-3.7-1.7-3.7-3.9S10 6 12 6z"/>
        </svg>
      </button>
      <button class="social" type="button" aria-label="Login with X">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.4 3h3.2l-7 8 7.3 10h-5.5l-4.3-6-4.9 6H3.1l7.4-8.6L3.4 3H9l4 5.6L17.4 3zm-1.1 16.2h1.7L7.3 4.7H5.4l10.9 14.5z"/>
        </svg>
      </button>
    </div>

    <p class="footer">Don't have an account? <a href="register.html">Register Now</a></p>

    <div class="home-indicator"></div>
  </main>

<script>
  const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.6 12S6.2 5.6 12 5.6 21.4 12 21.4 12 17.8 18.4 12 18.4 2.6 12 2.6 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.7"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.6 12S6.2 5.6 12 5.6 21.4 12 21.4 12 17.8 18.4 12 18.4 2.6 12 2.6 12z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.7"/><path d="m4.8 4.8 14.4 14.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';

  const pwdInput = document.getElementById("password");
  const eyeBtn = document.getElementById("eyePwd");

  eyeBtn.innerHTML = EYE_OPEN;

  eyeBtn.addEventListener("click", function () {
    const show = pwdInput.type === "password";
    pwdInput.type = show ? "text" : "password";
    eyeBtn.innerHTML = show ? EYE_OFF : EYE_OPEN;
    eyeBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    eyeBtn.setAttribute("aria-pressed", String(show));
    pwdInput.focus();
  });

  const loginForm = document.getElementById("loginForm");
  const loginBtn = document.getElementById("loginBtn");

  loginForm.addEventListener("submit", function (event) {
    event.preventDefault();
    if (loginBtn.dataset.busy === "1") return;

    loginBtn.dataset.busy = "1";
    loginBtn.classList.add("is-busy");
    loginBtn.textContent = "Signing in...";

    window.setTimeout(function () {
      loginBtn.textContent = "Login";
      loginBtn.classList.remove("is-busy");
      delete loginBtn.dataset.busy;
    }, 1400);
  });

  const tabs = document.querySelectorAll(".social");
  tabs.forEach(function (btn) {
    btn.addEventListener("click", function () {
      btn.animate(
        [ { transform: "scale(1)" }, { transform: "scale(.9)" }, { transform: "scale(1)" } ],
        { duration: 240, easing: "ease-out" }
      );
    });
  });
</script>
</body>
</html>
