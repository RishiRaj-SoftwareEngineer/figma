<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trip Australia - Seat Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --green: #4CAF50;
    --green-deep: #2E7D32;
    --green-text: #3B9E4B;
    --blue: #2196F3;
    --blue-deep: #1565C0;
    --navy: #1A237E;
    --ink: #232C6B;
    --cream: #FFF9C4;
    --amber: #D98324;
    --amber-circle: #F0A63C;
    --cream-panel: #FCF3D6;
    --panel: #F1F4F0;
    --gray: #E0E0E0;
    --exit: #4A4A4A;
    --muted: #8B93A7;
    --white: #FFFFFF;
    --card-shadow: 0 6px 16px rgba(20,45,25,.10);
  }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    padding: 28px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F3F6F2;
    font-family: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* device frame with the theme gradient */
  .screen {
    position: relative;
    width: 393px;
    height: 852px;
    padding: 14px 18px 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 40px;
    background: linear-gradient(178deg, #6FC474 0%, #8BCA80 30%, #B6D783 62%, #DCE9A0 88%, #E9EEB2 100%);
    box-shadow: 0 34px 70px -26px rgba(28,60,32,.45), 0 0 0 1px rgba(20,45,25,.10);
  }

  .screen::before {
    content: "";
    position: absolute;
    top: -140px; right: -120px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 68%);
    pointer-events: none;
  }

  /* header */
  .app-bar {
    position: relative;
    z-index: 2;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-family: "Pacifico", "Brush Script MT", cursive;
    font-size: 19.5px;
    line-height: 1.3;
    color: var(--navy);
    padding-bottom: 2px;
  }

  .back-btn {
    flex: none;
    width: 34px; height: 34px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    background: none;
    color: var(--white);
    cursor: pointer;
    transition: transform .18s ease, opacity .18s ease;
  }

  .back-btn svg { width: 24px; height: 24px; }
  .back-btn:hover { transform: translateX(-2px); opacity: .9; }
  .back-btn:active { transform: scale(.92); }

  /* page title card */
  .title-card {
    position: relative;
    z-index: 2;
    margin-top: 10px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: var(--white);
    box-shadow: var(--card-shadow);
  }

  .title {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.4px;
    color: var(--navy);
  }

  /* live selection counter */
  .selection-count {
    position: relative;
    z-index: 2;
    margin: 7px 0 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .1px;
    color: rgba(255,255,255,.92);
    text-shadow: 0 1px 2px rgba(24,60,30,.28);
  }

  .selection-count b { font-weight: 700; color: #fff; }

  /* notice banner */
  .notice {
    position: relative;
    z-index: 2;
    margin-top: 10px;
    min-height: 48px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    gap: 9px;
    border-radius: 14px;
    background: var(--cream-panel);
    box-shadow: var(--card-shadow);
  }

  .notice-icon {
    flex: none;
    width: 22px; height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--amber-circle);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }

  .notice p {
    margin: 0;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--amber);
  }

  /* two column grid used by heads + illustrations + cabins */
  .grid-2 {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 152px 188px;
    gap: 17px;
  }

  /* cabin labels */
  .cabin-heads { margin-top: 14px; }

  .head { display: flex; flex-direction: column; gap: 3px; }
  .head.economy { align-items: flex-end; text-align: right; }

  .head-title {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: -.1px;
    color: var(--white);
    text-shadow: 0 1px 2px rgba(24,60,30,.25);
  }

  .head-sub {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(255,255,255,.78);
  }

  /* seat illustrations */
  .illustrations { margin-top: 8px; }

  .illu {
    height: 76px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 16px;
    box-shadow: var(--card-shadow);
  }

  .illu.business { background: #F1F6EF; }
  .illu.economy  { background: #EFF4FB; }

  .illu svg { display: block; width: 82%; height: auto; }
  .illu.economy svg { width: 72%; }

  /* cabins */
  .cabins {
    margin-top: 14px;
    align-items: start;
  }

  .col-left { display: flex; flex-direction: column; gap: 12px; }

  .cabin-card {
    padding: 11px;
    border-radius: 18px;
    background: var(--white);
    box-shadow: var(--card-shadow);
  }

  .rows { display: flex; flex-direction: column; }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rows.business .row { height: 30px; margin-bottom: 30px; }
  .rows.economy  .row { height: 27px; margin-bottom: 8px; }
  .rows .row:last-child { margin-bottom: 0; }

  .aisle { flex: none; width: 12px; }

  /* seats */
  .seat {
    position: relative;
    z-index: 1;
    flex: none;
    padding: 0;
    border: 0;
    display: grid;
    place-items: center;
    font-family: inherit;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease;
  }

  .seat::before {
    content: "";
    position: absolute;
    top: 17%; left: 20%; right: 20%;
    height: 3px;
    border-radius: 3px;
    background: currentColor;
    opacity: .3;
  }

  .seat.b { width: 28px; height: 28px; border-radius: 9px; font-size: 10px; }
  .seat.e { width: 23px; height: 23px; border-radius: 7px; font-size: 8.5px; }

  .seat.is-available { color: #fff; }
  .seat.is-available.b { background: var(--green); box-shadow: 0 2px 6px rgba(76,175,80,.30); }
  .seat.is-available.e { background: var(--blue);  box-shadow: 0 2px 6px rgba(33,150,243,.30); }
  .seat.is-available:hover { transform: translateY(-2px); }
  .seat.is-available.b:hover { background: #43A047; box-shadow: 0 6px 12px rgba(76,175,80,.36); }
  .seat.is-available.e:hover { background: #1E88E5; box-shadow: 0 6px 12px rgba(33,150,243,.36); }
  .seat.is-available:active { transform: scale(.92); }

  .seat.is-reserved { background: var(--gray); color: rgba(255,255,255,.9); cursor: not-allowed; }
  .seat.is-exit { background: var(--exit); color: rgba(255,255,255,.55); cursor: not-allowed; }

  .seat.is-selected { color: #fff; transform: translateY(-2px) scale(1.07); }
  .seat.is-selected.b { background: var(--green-deep); box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--green), 0 6px 13px rgba(46,125,50,.40); }
  .seat.is-selected.e { background: var(--blue-deep);  box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--blue), 0 6px 13px rgba(21,101,192,.40); }
  .seat.is-selected::before { opacity: .45; }

  .seat:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--navy); }

  /* exit rows */
  .rows.economy .row.is-exit { margin-top: 16px; }

  .rows.economy .row.is-exit::before {
    content: "";
    position: absolute;
    left: -11px; right: -11px;
    top: -22px; bottom: -7px;
    z-index: 0;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(255,249,196,.5) 0%, var(--cream) 60%);
  }

  .exit-tag {
    position: absolute;
    top: -20px; left: 0; right: 0;
    z-index: 2;
    text-align: center;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #8D6E00;
  }

  /* legend */
  .legend {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    border-radius: 18px;
    background: var(--white);
    box-shadow: var(--card-shadow);
  }

  .legend-head {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--green-text);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 10.5px;
    font-weight: 500;
    color: #4A5372;
    white-space: nowrap;
  }

  .swatch {
    flex: none;
    width: 20px; height: 20px;
    display: grid;
    place-items: center;
    border-radius: 6px;
  }

  .swatch.selected {
    color: #fff;
    font-size: 10px;
    background: linear-gradient(135deg, var(--green) 0 50%, var(--blue) 50% 100%);
  }

  .swatch.exit { background: var(--exit); }
  .swatch.reserved { background: var(--gray); box-shadow: inset 0 0 0 1px rgba(26,35,126,.06); }

  /* home indicator */
  .home-indicator {
    margin-top: auto;
    margin-bottom: 9px;
    align-self: center;
    flex: none;
    width: 126px; height: 5px;
    border-radius: 99px;
    background: rgba(255,255,255,.72);
  }

  @keyframes pop {
    0%   { transform: translateY(-2px) scale(.9); }
    60%  { transform: translateY(-3px) scale(1.14); }
    100% { transform: translateY(-2px) scale(1.07); }
  }

  .seat.pop { animation: pop .26s ease-out; }

  @media (prefers-reduced-motion: reduce) {
    .seat, .back-btn { transition: none; }
    .seat.pop { animation: none; }
  }
</style>
</head>
<body>
  <main class="screen" aria-label="Trip Australia seat details screen">

    <header class="app-bar">
      <div class="brand">Trip Australia</div>
      <button class="back-btn" type="button" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <section class="title-card">
      <h1 class="title">Seat Details</h1>
    </section>

    <p class="selection-count" id="selectionCount">No seats selected</p>

    <section class="notice">
      <span class="notice-icon" aria-hidden="true">!</span>
      <p>Please review your seat selection. Exit row seats cannot be reserved.</p>
    </section>

    <div class="grid-2 cabin-heads">
      <div class="head business">
        <span class="head-title">Business Class Seat</span>
        <span class="head-sub">Rows 1 - 5</span>
      </div>
      <div class="head economy">
        <span class="head-title">Economy Class Seat</span>
        <span class="head-sub">Rows 6 - 17</span>
      </div>
    </div>

    <div class="grid-2 illustrations">
      <div class="illu business">
        <svg viewBox="0 0 120 74" fill="none" aria-hidden="true">
          <ellipse cx="58" cy="66" rx="30" ry="4.5" fill="#1A237E" opacity=".07"/>
          <path d="M40 58h36l4 7H36z" fill="#2E7D32"/>
          <rect x="26" y="41" width="56" height="18" rx="9" fill="#4CAF50"/>
          <g transform="rotate(-7 57 27)">
            <rect x="41" y="11" width="33" height="34" rx="10" fill="#4CAF50"/>
            <rect x="41" y="4" width="33" height="12" rx="6" fill="#2E7D32"/>
          </g>
          <rect x="72" y="33" width="22" height="9" rx="4.5" fill="#2E7D32"/>
        </svg>
      </div>
      <div class="illu economy">
        <svg viewBox="0 0 120 74" fill="none" aria-hidden="true">
          <ellipse cx="58" cy="66" rx="26" ry="4" fill="#1A237E" opacity=".07"/>
          <path d="M42 59h32l4 6H38z" fill="#1565C0"/>
          <rect x="30" y="45" width="48" height="15" rx="7.5" fill="#2196F3"/>
          <g transform="rotate(-6 57 32)">
            <rect x="42" y="18" width="30" height="30" rx="9" fill="#2196F3"/>
            <rect x="43" y="12" width="28" height="10" rx="5" fill="#1565C0"/>
          </g>
          <rect x="68" y="38" width="18" height="8" rx="4" fill="#1565C0"/>
        </svg>
      </div>
    </div>
    <div class="grid-2 cabins">
      <div class="col-left">
        <section class="cabin-card" aria-label="Business class seat map">
          <div class="rows business" id="businessRows"></div>
        </section>

        <aside class="legend" aria-label="Seat legend">
          <span class="legend-head">Legend</span>
          <div class="legend-item"><span class="swatch selected">&#10003;</span>Selected</div>
          <div class="legend-item"><span class="swatch exit"></span>Emergency exit</div>
          <div class="legend-item"><span class="swatch reserved"></span>Reserved</div>
        </aside>
      </div>

      <section class="cabin-card" aria-label="Economy class seat map">
        <div class="rows economy" id="economyRows"></div>
      </section>
    </div>

    <div class="home-indicator"></div>
  </main>

<script>
  const BUSINESS = {
    startRow: 1,
    rowCount: 5,
    letters: ["A", "B", "C", "D"],
    aisleAfter: 2,
    sizeClass: "b",
    label: "Business",
    reserved: ["1C", "2A", "4D", "5B"],
    exitRows: []
  };

  const ECONOMY = {
    startRow: 6,
    rowCount: 12,
    letters: ["A", "B", "C", "D", "E", "F"],
    aisleAfter: 3,
    sizeClass: "e",
    label: "Economy",
    reserved: ["7A", "8F", "9C", "10D", "11B", "12E", "13A", "15C", "16F", "17D"],
    exitRows: [6, 14]
  };

  const countEl = document.getElementById("selectionCount");

  function buildCabin(cabin, mountId) {
    const mount = document.getElementById(mountId);
    const reserved = new Set(cabin.reserved);
    const exits = new Set(cabin.exitRows);

    for (let i = 0; i < cabin.rowCount; i++) {
      const rowNumber = cabin.startRow + i;
      const row = document.createElement("div");
      row.className = "row";

      if (exits.has(rowNumber)) {
        row.classList.add("is-exit");
        const tag = document.createElement("span");
        tag.className = "exit-tag";
        tag.textContent = "Emergency exit";
        row.appendChild(tag);
      }

      cabin.letters.forEach((letter, index) => {
        if (index === cabin.aisleAfter) {
          const aisle = document.createElement("span");
          aisle.className = "aisle";
          aisle.setAttribute("aria-hidden", "true");
          row.appendChild(aisle);
        }

        const code = rowNumber + letter;
        const seat = document.createElement("button");
        seat.type = "button";
        seat.className = "seat " + cabin.sizeClass;
        seat.dataset.code = code;

        let state = "available";
        if (exits.has(rowNumber)) state = "exit";
        else if (reserved.has(code)) state = "reserved";

        seat.dataset.state = state;
        seat.dataset.label = cabin.label + " seat " + code;
        seat.classList.add("is-" + state);
        seat.textContent = letter;
        seat.setAttribute("aria-pressed", "false");
        seat.setAttribute("aria-label", seat.dataset.label + ", " + state);
        if (state !== "available") seat.disabled = true;

        row.appendChild(seat);
      });

      mount.appendChild(row);
    }
  }

  function updateCount() {
    const seats = Array.prototype.slice.call(document.querySelectorAll(".seat.is-selected"));
    const n = seats.length;

    if (n === 0) {
      countEl.textContent = "No seats selected";
      return;
    }

    countEl.innerHTML = "<b>" + n + "</b> " + (n === 1 ? "seat" : "seats") + " selected";
  }

  function toggleSeat(seat) {
    if (seat.dataset.state !== "available") return;

    const letter = seat.dataset.code.slice(-1);
    const isSelected = seat.classList.toggle("is-selected");

    seat.textContent = isSelected ? "\u2713" : letter;
    seat.setAttribute("aria-pressed", String(isSelected));
    seat.setAttribute("aria-label", seat.dataset.label + ", " + (isSelected ? "selected" : "available"));

    if (isSelected) {
      seat.classList.remove("pop");
      void seat.offsetWidth;
      seat.classList.add("pop");
    }

    updateCount();
  }

  document.addEventListener("click", function (event) {
    const seat = event.target.closest(".seat");
    if (seat) toggleSeat(seat);
  });

  buildCabin(BUSINESS, "businessRows");
  buildCabin(ECONOMY, "economyRows");
  updateCount();
</script>
</body>
</html>
